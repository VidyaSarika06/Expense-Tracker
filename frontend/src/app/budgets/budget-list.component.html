<div class="app-shell">
  <app-sidebar [collapsed]="sidebarCollapsed"></app-sidebar>
  <div class="main-area">
    <app-header (toggleSidebar)="sidebarCollapsed = !sidebarCollapsed"></app-header>
    <main class="page-content">

      <div class="page-header">
        <h2>Budgets</h2>
        <button class="btn btn-primary" (click)="openCreate()">+ Add Budget</button>
      </div>

      <div class="card">
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>#</th><th>Month</th><th>Category</th><th>Limit</th><th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let b of budgets; let i = index">
                <td>{{ i + 1 }}</td>
                <td>{{ b.month }}</td>
                <td>{{ b.categoryName }}</td>
                <td class="text-info">₹{{ b.limitAmount | number:'1.0-0' }}</td>
                <td class="actions">
                  <button class="btn btn-outline btn-sm" (click)="openEdit(b)">Edit</button>
                  <button class="btn btn-danger btn-sm"  (click)="delete(b.id!)">Delete</button>
                </td>
              </tr>
              <tr *ngIf="!budgets.length">
                <td colspan="5" class="empty-row">No budgets found. Create one!</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
    <app-footer></app-footer>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" *ngIf="showModal">
  <div class="modal">
    <h3>{{ editMode ? 'Edit Budget' : 'New Budget' }}</h3>
    <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="form-group">
        <label>Month *</label>
        <input type="month" formControlName="month" />
        <span class="error-msg" *ngIf="form.get('month')?.invalid && form.get('month')?.touched">Month is required</span>
      </div>
      <div class="form-group">
        <label>Category *</label>
        <select formControlName="categoryId">
          <option [ngValue]="null" disabled>Select category</option>
          <option *ngFor="let c of categories" [value]="c.id">{{ c.name }}</option>
        </select>
        <span class="error-msg" *ngIf="form.get('categoryId')?.invalid && form.get('categoryId')?.touched">Category is required</span>
      </div>
      <div class="form-group">
        <label>Budget Limit *</label>
        <input type="number" formControlName="limitAmount" placeholder="0.00" min="0.01" step="0.01" />
        <span class="error-msg" *ngIf="form.get('limitAmount')?.invalid && form.get('limitAmount')?.touched">Limit must be greater than 0</span>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" (click)="showModal = false">Cancel</button>
        <button type="submit" class="btn btn-primary">{{ editMode ? 'Update' : 'Create' }}</button>
      </div>
    </form>
  </div>
</div>
