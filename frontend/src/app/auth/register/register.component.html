<div class="auth-page">
  <div class="auth-card">

    <div class="auth-brand">
      <div class="brand-icon">💰</div>
      <h1>Create Account</h1>
      <p>Join Expense Tracker today</p>
    </div>

    <div class="alert alert-danger"  *ngIf="error">{{ error }}</div>
    <div class="alert alert-success" *ngIf="success">{{ success }}</div>

    <form [formGroup]="form" (ngSubmit)="submit()">

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" formControlName="name" placeholder="example: Vidya" />
        <span class="error-msg" *ngIf="f['name'].invalid && f['name'].touched">Name is required</span>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" formControlName="email" placeholder="you@example.com" />
        <span class="error-msg" *ngIf="f['email'].invalid && f['email'].touched">Valid email is required</span>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="Min 8 characters" />
        <span class="error-msg" *ngIf="f['password'].invalid && f['password'].touched">
          Password must be at least 8 characters
        </span>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" formControlName="confirmPassword" placeholder="Repeat password" />
        <span class="error-msg" *ngIf="form.hasError('mismatch') && f['confirmPassword'].touched">
          Passwords do not match
        </span>
      </div>

      <div class="form-group">
        <label>Role</label>
        <select formControlName="role">
          <option value="ROLE_STUDENT">Student</option>
          <option value="ROLE_INDIVIDUAL">Individual</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="loading">
        {{ loading ? 'Creating account...' : 'Create Account' }}
      </button>

    </form>

    <p class="auth-footer">
      Already have an account? <a routerLink="/login">Sign In</a>
    </p>

  </div>
</div>
