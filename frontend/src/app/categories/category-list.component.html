<div class="app-shell">
  <app-sidebar [collapsed]="sidebarCollapsed"></app-sidebar>
  <div class="main-area">
    <app-header (toggleSidebar)="sidebarCollapsed = !sidebarCollapsed"></app-header>
    <main class="page-content">

      <div class="page-header">
        <h2>Categories</h2>
        <button class="btn btn-primary" (click)="openCreate()">+ Add Category</button>
      </div>

      <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

      <div class="card">
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Name</th>
                <th>Description</th>
                <th>Created</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let cat of categories; let i = index">
                <td>{{ i + 1 }}</td>
                <td><strong>{{ cat.name }}</strong></td>
                <td>{{ cat.description ?? '—' }}</td>
                <td>{{ cat.createdAt | date:'mediumDate' }}</td>
                <td class="actions">
                  <button class="btn btn-outline btn-sm" (click)="openEdit(cat)">Edit</button>
                  <button class="btn btn-danger btn-sm"  (click)="delete(cat.id!)">Delete</button>
                </td>
              </tr>
              <tr *ngIf="!categories.length">
                <td colspan="5" class="empty-row">No categories found. Create one!</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
    <app-footer></app-footer>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" *ngIf="showModal">
  <div class="modal">
    <h3>{{ editMode ? 'Edit Category' : 'New Category' }}</h3>
    <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="form-group">
        <label>Name *</label>
        <input type="text" formControlName="name" placeholder="e.g. Food" />
        <span class="error-msg" *ngIf="form.get('name')?.invalid && form.get('name')?.touched">
          Name is required
        </span>
      </div>
      <div class="form-group">
        <label>Description</label>
        <input type="text" formControlName="description" placeholder="Optional description" />
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" (click)="showModal = false">Cancel</button>
        <button type="submit" class="btn btn-primary">{{ editMode ? 'Update' : 'Create' }}</button>
      </div>
    </form>
  </div>
</div>
